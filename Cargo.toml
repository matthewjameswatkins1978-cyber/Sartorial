[workspace]
members = ["crates/sartorial-core", "crates/sartorial"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["Matthew Watkins <matthew@biscuitlogic.com>"]
repository = "https://github.com/matthewjameswatkins1978-cyber/Sartorial"
license = "MIT"

[workspace.dependencies]
anstyle = "1.0"
unicode-width = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anstream = "0.6"
crossterm = "0.28"
indicatif = { version = "0.17", default-features = false }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
